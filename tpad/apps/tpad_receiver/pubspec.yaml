name: tpad_receiver
description: TPad Windows receiver — tray app turning phone touch input into mouse/keyboard actions.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  tpad_protocol:
    path: ../../packages/tpad_protocol
  tpad_theme:
    path: ../../packages/tpad_theme
  tray_manager: ^0.5.0
  window_manager: ^0.4.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
